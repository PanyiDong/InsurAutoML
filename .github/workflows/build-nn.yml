name: build_nn
on:
  - pull_request
  - push
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OS: ubuntu-latest
      PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # reuse the downloaded packages between runs
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install C++ headers (nanoflann for the InformedAutoML extension)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnanoflann-dev
          python -m pip install --upgrade pip
      - name: "run builds (with neural network)"
        run: |
          pip install -e ".[nn]"
          python -c "import InsurAutoML, torch; print(InsurAutoML.__version__, torch.__version__)"

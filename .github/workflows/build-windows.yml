name: Windows
on:
  - pull_request
  - push
jobs:
  run:
    runs-on: windows-latest
    env:
      OS: windows-latest
      PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # reuse the downloaded packages between runs
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: "run builds (without neural network)"
        run: |
          pip install -e ".[normal]"
          python -c "import InsurAutoML; print(InsurAutoML.__version__)"

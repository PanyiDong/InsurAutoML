name: Linux
on:
  - pull_request
  - push
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OS: ubuntu-latest
      PYTHON: "3.9"
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@master
        with:
          python-version: 3.9
      - name: Setup conda and C++ build deps
        uses: conda-incubator/setup-miniconda@v2
        with:
          python-version: 3.9
          auto-update-conda: true
      - name: Install C/C++ headers and build tools
        run: |
          conda install -y -c conda-forge nanoflann pybind11 cmake ninja
          python -m pip install --upgrade pip
          python -m pip install cmake pybind11
      - name: Setup environment
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: "run builds (without neural network)"
        run: |
          git describe --tags
          pip install -e .[normal]

name: CodeCov
on:
  - pull_request
permissions:
  contents: read
  id-token: write # OIDC authentication for the Codecov upload
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OS: ubuntu-latest
      PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install C++ headers (nanoflann for the InformedAutoML extension)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnanoflann-dev
          python -m pip install --upgrade pip
      - name: "generate report"
        run: |
          INFORMEDAUTOML=1 pip install -e ".[informed]" pytest pytest-cov
          python -c "from InsurAutoML._optional import missing_informed_components as m; assert not m(), m()"
          pytest tests/ --cov=InsurAutoML --cov-report=xml
      # codecov-action >= v4 needs an upload token, use GitHub OIDC (no secret needed)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: uitests
          use_oidc: true
          fail_ci_if_error: false
          verbose: true

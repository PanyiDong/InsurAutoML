name: Format python code
# check the formatting (black) and lint (ruff) of the code; format locally with
# pre-commit (pip install pre-commit && pre-commit install) or black .
on:
  pull_request:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  lint:
    name: black / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install black and ruff
        run: pip install black==26.10.1 ruff==0.17.5
      - name: Lint (ruff)
        run: ruff check .
      - name: Formatting (black)
        run: black --check --diff .

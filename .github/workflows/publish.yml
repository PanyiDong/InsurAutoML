name: Upload PyPI Release

on:
  release:
    types:
      - published
  workflow_dispatch:
  # pull_request:
  # push:

jobs:
  build_wheel_on_linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      # source distribution only: the optional InformedAutoML C++ extension is built
      # on the user's machine (INFORMEDAUTOML=1 pip install "InsurAutoML[informed]")
      - name: Build sdist
        run: |
          python -m build --sdist

      - name: Upload to artifacts linux
        uses: actions/upload-artifact@v7
        with:
          name: dist_linux
          path: dist/*

  publish_to_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheel_on_linux]
    permissions:
      id-token: write 
    steps:

      - name: Download artifacts from linux
        uses: actions/download-artifact@v8
        with:
          name: dist_linux
          path: dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

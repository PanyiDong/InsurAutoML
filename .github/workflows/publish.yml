name: Upload PyPI Release

on:
  release:
    types:
      - published
  workflow_dispatch:
  # pull_request:
  # push:

jobs:
  build_wheel_on_linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          sudo apt install libnanoflann-dev
          python -m pip install --upgrade pip
          pip install "setuptools>=69.3" wheel twine cython auditwheel "patchelf>=0.14"
      - name: Build wheel
        run: |
          python setup.py sdist 

      - name: Upload to artifacts linux
        uses: actions/upload-artifact@v7
        with:
          name: dist_linux
          path: dist/*

  publish_to_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheel_on_linux]
    permissions:
      id-token: write 
    steps:

      - name: Download artifacts from linux
        uses: actions/download-artifact@v8
        with:
          name: dist_linux
          path: dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

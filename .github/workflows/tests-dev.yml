name: dev_test
on:
  - pull_request
jobs:
  run:
    runs-on: self-hosted
    env:
      OS: ubuntu-latest
      PYTHON: "3.9"
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@master
        with:
          python-version: 3.9
      - name: Setup conda and C++ build deps
        uses: conda-incubator/setup-miniconda@v2
        with:
          python-version: 3.9
          auto-update-conda: true
      - name: Install C/C++ headers and build tools
        run: |
          sudo apt install libnanoflann-dev
          conda install -y -c conda-forge nanoflann pybind11 cmake ninja
          python -m pip install --upgrade pip
          python -m pip install cmake pybind11
      - name: "run tests (with neural network)"
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .[dev]
          pytest tests/test_hpo

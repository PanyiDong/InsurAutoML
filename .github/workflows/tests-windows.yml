name: Windows_test
on:
  - pull_request
jobs:
  run:
    runs-on: windows-latest
    env:
      OS: windows-latest
      PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      # the InformedAutoML C++ extension is not supported on Windows,
      # tests of the informed pipelines are skipped
      - name: "run tests (without neural network)"
        run: |
          pip install -e ".[informed]" pytest
          pytest tests/

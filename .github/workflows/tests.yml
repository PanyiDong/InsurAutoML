name: Linux_test
on:
  - pull_request
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OS: ubuntu-latest
      PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install C++ headers (nanoflann for the InformedAutoML extension)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnanoflann-dev
          python -m pip install --upgrade pip
      - name: "run tests (without neural network)"
        run: |
          INFORMEDAUTOML=1 pip install -e ".[informed]" pytest
          python -c "from InsurAutoML._optional import missing_informed_components as m; assert not m(), m()"
          pytest tests/
